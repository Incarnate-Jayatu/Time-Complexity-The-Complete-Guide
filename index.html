<script>
const DATA = {"title": "Time Complexity \u2014 The Complete Guide", "subtitle": "From first principles to interview-ready mastery", "sections": [{"num": "1", "title": "Introduction to Time Complexity", "blocks": [{"title": null, "items": [{"term": "Definition of Time Complexity", "body": "Time complexity is a mathematical measure of the amount of time an algorithm takes to run as a function of the length of its input. It does not measure wall-clock seconds (which depend on hardware, compiler, and load) but rather the number of elementary steps the algorithm performs, expressed as a function of input size n. Two algorithms solving the same problem can be compared purely by how their step-count grows, independent of what machine runs them."}, {"term": "Input Size (n)", "body": "Input size, denoted n, is the parameter that captures how much data the algorithm must process \u2014 the number of elements in an array, nodes in a graph, digits in a number, or characters in a string. All complexity statements are made relative to n, so the same algorithm can be 'fast' for small n and 'slow' for large n; complexity analysis is really about the algorithm's behaviour as n grows without bound."}, {"term": "Growth Rate of Algorithms", "body": "The growth rate describes how the number of operations increases as n increases. An algorithm whose operation count doubles when n doubles (linear growth) behaves very differently at scale from one whose operation count squares when n doubles (quadratic growth). Comparing growth rates \u2014 not raw operation counts at one specific n \u2014 is the core purpose of complexity analysis, because growth rate determines which algorithm wins for large inputs even if a 'slower-growing' algorithm has more overhead for small inputs."}, {"term": "Primitive Operations", "body": "A primitive operation is a basic, constant-time step: an arithmetic operation, a comparison, an assignment, an array index access, or a single method call that doesn't itself loop. Complexity analysis counts how many primitive operations execute as a function of n, then simplifies that count into asymptotic notation. Not every line of code is one primitive operation \u2014 a line that calls a loop or another function contributes the cost of everything inside it."}, {"term": "Machine-independent Analysis", "body": "Because different machines execute operations at different speeds, time complexity analysis abstracts away clock speed, cache behaviour, and instruction sets, and instead counts the number of primitive operations symbolically. This makes complexity a property of the algorithm itself, not of the hardware running it \u2014 an O(n log n) algorithm is asymptotically better than an O(n^2) one on every machine, even though the exact runtimes in seconds differ by machine."}]}, {"title": "1.1 Cases of Analysis", "items": [{"term": "Best Case", "body": "The best case is the minimum number of operations an algorithm performs over all inputs of a given size n \u2014 the most favourable input arrangement. For linear search, the best case is O(1): the target is the very first element. Best-case analysis is rarely used to judge an algorithm's general performance since it describes a lucky scenario, not a typical one."}, {"term": "Average Case", "body": "The average case is the expected number of operations over all possible inputs of size n, usually assuming a uniform probability distribution over inputs. It requires probabilistic reasoning and is often harder to derive than worst case, but it is the most realistic predictor of everyday performance \u2014 e.g. Quick Sort's average case is O(n log n) even though its worst case is O(n^2)."}, {"term": "Worst Case", "body": "The worst case is the maximum number of operations over all inputs of size n \u2014 the most unfavourable arrangement. It is the most commonly reported complexity because it gives a guaranteed upper bound on runtime regardless of input, which matters for real-time systems and ) and Omega(g(n)). Theta gives the exact asymptotic growth rate rather than just a bound, so it is the most precise of the three notations when it can be established, e.g. Merge Sort is Theta(n log n) in every case."}, {"term": "Little o", "body": "f(n) = o(g(n)) is a strict upper bound: f(n) grows strictly slower than g(n), meaning f(n)/g(n) -> 0 as n -> infinity. Unlike Big O, little-o cannot be tight \u2014 if f(n) = o(g(n)) then f can never equal a constant multiple of g for large n. Example: n = o(n^2)."}, {"term": "Little omega", "body": "f(n) = omega(g(n)) is a strict lower bound: f(n) grows strictly faster than g(n), meaning f(n)/g(n) -> infinity as n -> infinity. It is the strict counterpart of Big Omega, used less often in everyday algorithm analysis but important in theoretical proofs of separation between complexity classes."}]}, {"title": "2.2 Properties of Asymptotic Notation", "items": [{"term": "Transitivity", "body": "If f(n) = O(g(n)) and g(n) = O(h(n)), then f(n) = O(h(n)). This property (and its Omega/Theta analogues) lets complexity relationships be chained: if you know A is asymptotically no worse than B, and B is no worse than C, you can conclude A is no worse than C without re-deriving bounds from scratch."}, {"term": "Reflexivity", "body": "f(n) = O(f(n)) always holds (and similarly for Omega and Theta) \u2014 a function is trivially bounded by itself. This is a basic sanity property used implicitly whenever a function is compared to a scaled or shifted version of itself."}, {"term": "Symmetry (Theta)", "body": "f(n) = Theta(g(n)) if and only if g(n) = Theta(f(n)). Theta is the only one of the three main notations that is symmetric \u2014 Big O and Big Omega are not symmetric (f = O(g) does not imply g = O(f)), which is precisely why Theta is used to express a tight, mutual bound."}, {"term": "Ignore Constants", "body": "Asymptotic notation discards multiplicative constants: 5n, 100n, and 0.01n are all O(n). This reflects that constant factors depend on hardware and implementation details rather than the algorithm's fundamental scaling behaviour, and they become negligible compared to the growth rate as n becomes large."}, {"term": "Ignore Lower-order Terms", "body": "Only the fastest-growing term in an expression matters asymptotically: n^2 + n + 100 simplifies to O(n^2), because for large n the n^2 term dominates and the lower-order terms contribute a vanishing fraction of the total. This simplification is what makes asymptotic notation practical to reason about."}]}]}, {"num": "3", "title": "Growth of Functions", "blocks": [{"title": "3.1 Complexity Order (from fastest to slowest growth)", "items": [{"term": "O(1) \u2014 Constant", "body": "Runtime does not depend on n at all \u2014 e.g. accessing an array element by index, or pushing to a stack. This is the fastest possible complexity class."}, {"term": "O(log log n) \u2014 Double Logarithmic", "body": "Extremely slow-growing; appears in specialised structures like interpolation search on uniformly distributed data or certain van Emde Boas tree operations. For all practical input sizes this behaves almost like a constant."}, {"term": "O(log n) \u2014 Logarithmic", "body": "Occurs when each step eliminates a constant fraction of the remaining input, as in Binary Search or balanced binary search tree operations. Doubling n only adds one extra step, making logarithmic algorithms extremely scalable."}, {"term": "O((log n)^2) \u2014 Polylogarithmic", "body": "Grows slightly faster than log n but still far slower than any polynomial; seen in some advanced range-query and computational geometry structures that perform a logarithmic amount of work at each of log n levels."}, {"term": "O(sqrt(n)) \u2014 Root / Sub-linear", "body": "Grows faster than log n but slower than n; typical of algorithms that partition work into blocks of size sqrt(n), such as trial-division primality testing or Mo's algorithm for offline range queries."}, {"term": "O(n) \u2014 Linear", "body": "Runtime grows proportionally with n \u2014 every element is touched a constant number of times, as in a single pass Linear Search or array traversal."}, {"term": "O(n log n) \u2014 Linearithmic", "body": "The complexity of the fastest general comparison-based sorting algorithms (Merge Sort, Heap Sort) and many divide-and-conquer algorithms; grows only slightly faster than linear and scales well even for large n."}, {"term": "O(n (log n)^2)", "body": "Slightly slower than n log n; appears in some advanced divide-and-conquer algorithms (e.g. certain closest-pair or FFT-adjacent techniques) that pay an extra logarithmic factor per level."}, {"term": "O(n^2) \u2014 Quadratic", "body": "Typical of algorithms with nested loops over the input, such as Bubble Sort, Selection Sort, and Insertion Sort in the worst case, or naive pairwise comparison. Becomes impractical for n beyond roughly 10^4\u201310^5."}, {"term": "O(n^3) \u2014 Cubic", "body": "Typical of triple-nested loops, such as the naive matrix multiplication algorithm or the Floyd\u2013Warshall all-pairs shortest path algorithm. Practical only for small n (roughly up to a few hundred to a couple thousand)."}, {"term": "O(n^k) \u2014 Polynomial", "body": "Any fixed power of n; polynomial-time algorithms are considered 'efficient' in complexity theory (the class P), in contrast to exponential-time algorithms, even though large exponents k can still be impractical."}, {"term": "O(2^n) \u2014 Exponential", "body": "Runtime doubles with every additional element; typical of brute-force subset enumeration or naive recursive Fibonacci. Becomes infeasible beyond roughly n = 30\u201340."}, {"term": "O(3^n)", "body": "Grows even faster than O(2^n); appears in brute-force enumeration problems with three choices per element, such as some naive constraint-satisfaction or ternary partitioning algorithms."}, {"term": "O(n!) \u2014 Factorial", "body": "The complexity of brute-force generation of all permutations, as in a naive Travelling Salesman solution. Grows faster than any exponential and is intractable beyond roughly n = 10\u201312."}, {"term": "O(n^n)", "body": "The fastest-growing common complexity class, seen only in the most naive brute-force formulations (e.g. trying every function from an n-element set to itself); essentially never usable beyond tiny n."}]}, {"title": "3.2 Logarithmic Concepts", "items": [{"term": "Log Base 2", "body": "log2(n) counts how many times n can be halved before reaching 1 \u2014 it is the natural base for algorithms that repeatedly divide input in half, such as Binary Search and balanced trees, and is the default base implied whenever complexity is written as O(log n) in computer science."}, {"term": "Log Base 10", "body": "Common (base-10) logarithm; rarely used directly in algorithm analysis but relevant when reasoning about the number of digits in a number, since a number with n digits is roughly 10^n, i.e. n ~ log10(value)."}, {"term": "Change of Base Rule", "body": "log_b(n) = log_k(n) / log_k(b) for any base k \u2014 this means logarithms in different bases differ only by a constant multiplicative factor. Because asymptotic notation ignores constant factors, O(log2 n), O(log10 n), and O(ln n) are all simply written as O(log n)."}]}]}, {"num": "4", "title": "Complexity Analysis of Iterative Code", "blocks": [{"title": "4.1 Single Loop", "items": [{"term": "Increment by 1 (for i = 0; i < n; i++)", "body": "The loop runs exactly n times, each iteration doing O(1) work, giving total complexity O(n) \u2014 the canonical linear loop."}, {"term": "Increment by k (for i = 0; i < n; i += k)", "body": "The loop runs n/k times. Since k is a constant, n/k is still O(n) \u2014 dividing by a constant does not change the asymptotic class, only the constant factor."}, {"term": "Multiplication Update (i *= 2)", "body": "Starting at i = 1 and doubling each iteration until i >= n takes log2(n) iterations, giving O(log n). This pattern appears in binary search and exponential search style loops."}, {"term": "Division Update (i /= 2)", "body": "Starting at i = n and halving each iteration until i reaches 1 also takes log2(n) iterations, giving O(log n) \u2014 the mirror image of the multiplicative-update loop."}]}, {"title": "4.2 Nested Loops", "items": [{"term": "Independent Nested Loops", "body": "When the inner loop's bound does not depend on the outer loop's variable (e.g. outer loop runs n times, inner loop always runs m times), total work is the product of the two loop counts: O(n * m), or O(n^2) when both bounds are n."}, {"term": "Dependent Nested Loops", "body": "When the inner loop's bound depends on the outer variable (e.g. inner loop runs from 0 to i), the total iteration count is the sum 1 + 2 + ... + n = n(n+1)/2, which is still O(n^2) \u2014 the dependency changes the constant factor (roughly half the work of two full n loops) but not the asymptotic class."}, {"term": "Triangular Loops", "body": "A specific case of dependent nested loops where the inner loop scans only the unprocessed remainder of the array (common in pairwise comparisons, e.g. for i in range(n): for j in range(i+1, n)). The total comparisons form a triangular number, O(n^2), used in Bubble Sort and Selection Sort."}, {"term": "Reverse Loops", "body": "Loops that count downward (for i = n; i > 0; i--) have identical complexity to their upward-counting counterparts \u2014 direction of iteration does not affect the asymptotic count of operations, only which elements are visited first."}]}, {"title": "4.3 Multiple Loops", "items": [{"term": "Consecutive Loops", "body": "Loops that run one after another (not nested) have their complexities added, not multiplied: two separate O(n) loops in sequence give O(n) + O(n) = O(2n) = O(n), since asymptotic notation drops constant factors."}, {"term": "Parallel Complexity Addition", "body": "When a program has independent blocks of differing complexity run in sequence, the total complexity is the sum, and the sum simplifies to the dominant (largest) term \u2014 e.g. an O(n) loop followed by an O(n^2) loop is O(n) + O(n^2) = O(n^2)."}, {"term": "Different Variables (m, n)", "body": "When two independent loops iterate over inputs of different sizes (e.g. one array of size n, another of size m), the total complexity must be expressed with both variables and cannot be collapsed into one \u2014 e.g. O(n) + O(m) = O(n + m), which is not the same as O(n) or O(m) alone since neither variable dominates the other in general."}]}, {"title": "4.4 Conditional Statements", "items": [{"term": "If", "body": "A single if-statement adds only a constant-time check; the overall complexity is determined by whichever branch does the most work, since only one branch executes per pass \u2014 it does not multiply complexity, it merely selects among branches."}, {"term": "If\u2013Else", "body": "Complexity is determined by the more expensive branch in the worst case (both branches are considered, and the analysis takes the maximum, not the sum, since exactly one branch runs per execution)."}, {"term": "Switch Case", "body": "Behaves like a multi-way if-else: the complexity is the worst-case complexity among all cases, and the switch dispatch itself is O(1) for compiler-optimised jump tables or O(k) for k cases checked linearly, depending on implementation."}]}]}, {"num": "5", "title": "Complexity Analysis of Recursive Code", "blocks": [{"title": "5.1 Recursion Types", "items": [{"term": "Linear Recursion", "body": "Each call makes exactly one further recursive call (e.g. factorial(n) = n * factorial(n-1)). The recursion depth is O(n) and, with O(1) work per call, total time is O(n)."}, {"term": "Binary Recursion", "body": "Each call makes two further recursive calls (e.g. naive Fibonacci: fib(n) = fib(n-1) + fib(n-2)). Without memoization this creates an exponential call tree, O(2^n), because overlapping subproblems are recomputed repeatedly."}, {"term": "Multiple Recursion", "body": "Each call makes more than two recursive calls (e.g. generating all subsets or all n-ary tree paths). Complexity grows with the branching factor raised to the depth, often exponential."}, {"term": "Tail Recursion", "body": "The recursive call is the very last operation in the function, with no pending work after it returns. Tail recursion allows compilers/interpreters that support tail-call optimisation to reuse the current stack frame, turning O(n) stack space into O(1) \u2014 though many languages (like Python) do not optimise this automatically."}, {"term": "Head Recursion", "body": "The recursive call happens first, before any other processing in the function (processing happens on the way back up the call stack, e.g. printing after the recursive call returns). Complexity is the same as the equivalent tail-recursive version, but head recursion cannot benefit from tail-call optimisation."}]}, {"title": "5.2 Recurrence Relations", "items": [{"term": "T(n) = T(n-1) + c", "body": "One recursive call on a problem one smaller, plus constant work \u2014 solves to T(n) = O(n) via simple substitution (this is linear recursion, e.g. factorial or linear search)."}, {"term": "T(n) = T(n/2) + c", "body": "One recursive call on half the problem, plus constant work \u2014 solves to T(n) = O(log n), the signature recurrence of Binary Search."}, {"term": "T(n) = 2T(n/2) + n", "body": "Two recursive calls each on half the problem, plus linear work to combine \u2014 solves to T(n) = O(n log n) by the Master Theorem, the signature recurrence of Merge Sort."}, {"term": "T(n) = T(n-1) + T(n-2)", "body": "Two recursive calls on problems one and two smaller (no shrinking by a fraction) \u2014 solves to exponential time, roughly O(phi^n) where phi is the golden ratio (~1.618), because subproblems overlap massively and are recomputed; this is the naive recursive Fibonacci recurrence."}]}, {"title": "5.3 Solving Recurrences", "items": [{"term": "Iteration / Substitution Method", "body": "Repeatedly substitute the recurrence into itself to expose a pattern (e.g. unrolling T(n) = T(n-1) + n into n + (n-1) + (n-2) + ... + 1), then sum the resulting series in closed form. Works well for simple recurrences but can be error-prone for complex ones."}, {"term": "Recursion Tree Method", "body": "Draw the recursion as a tree where each node's cost is the non-recursive work done at that call, then sum the cost across all levels of the tree. This visually reveals whether the total cost is dominated by the root, the leaves, or spread evenly across levels, which directly motivates the Master Theorem's three cases."}, {"term": "Master Theorem", "body": "A direct formula for recurrences of the form T(n) = aT(n/b) + f(n), where a is the number of subproblems, n/b is the subproblem size, and f(n) is the work done outside the recursive calls. It compares f(n) against n^(log_b a) to determine which of three cases applies."}, {"term": "Master Theorem \u2014 Case 1 (leaf-heavy)", "body": "If f(n) = O(n^(log_b a - eps)) for some eps > 0 (f(n) grows polynomially slower than n^(log_b a)), then T(n) = Theta(n^(log_b a)) \u2014 the cost is dominated by the leaves of the recursion tree."}, {"term": "Master Theorem \u2014 Case 2 (balanced)", "body": "If f(n) = Theta(n^(log_b a)) (f(n) grows at the same rate), then T(n) = Theta(n^(log_b a) * log n) \u2014 cost is spread evenly across all levels, each contributing the same amount, e.g. Merge Sort."}, {"term": "Master Theorem \u2014 Case 3 (root-heavy)", "body": "If f(n) = Omega(n^(log_b a + eps)) for some eps > 0, and the regularity condition a*f(n/b) <= c*f(n) holds for some c < 1, then T(n) = Theta(f(n)) \u2014 the cost is dominated by the work done at the root/top level."}, {"term": "Akra\u2013Bazzi Method (Advanced)", "body": "A generalisation of the Master Theorem for recurrences with multiple differently-sized subproblems, T(n) = sum(a_i * T(b_i * n)) + g(n) where the a_i, b_i can differ per term. It finds an exponent p such that sum(a_i * b_i^p) = 1, then the solution is Theta(n^p * (1 + integral of g(u)/u^(p+1) du)) \u2014 used for asymmetric divide-and-conquer recurrences the Master Theorem cannot handle directly."}]}]}, {"num": "6", "title": "Divide and Conquer Complexity", "blocks": [{"title": "6.1 Components", "items": [{"term": "Divide", "body": "Break the problem into smaller subproblems of the same type, typically by splitting the input (e.g. splitting an array at its midpoint). The cost of dividing is usually O(1) for index computation, though some algorithms incur O(n) partitioning cost here (e.g. Quick Sort's partition step)."}, {"term": "Conquer", "body": "Solve the subproblems recursively; once a subproblem is small enough (the base case), solve it directly without further recursion. This is where the recursive structure \u2014 and hence the recurrence relation \u2014 comes from."}, {"term": "Combine", "body": "Merge the subproblem solutions into a solution for the original problem, e.g. merging two sorted halves in Merge Sort (O(n)) or comparing/combining results in the closest-pair algorithm. The cost of combining is the f(n) term in the Master Theorem recurrence and often determines the overall complexity."}]}, {"title": "6.2 Examples", "items": [{"term": "Merge Sort", "body": "Divides the array in half (O(1)), recursively sorts each half, and merges the two sorted halves in O(n). Recurrence T(n) = 2T(n/2) + n solves to Theta(n log n) by Master Theorem Case 2, in every case (best, average, worst) \u2014 it is not input-sensitive. Space complexity is O(n) for the auxiliary merge buffer."}, {"term": "Quick Sort", "body": "Partitions the array around a pivot (O(n)) so elements less than the pivot come before it and greater elements after, then recursively sorts each side. Average case is Theta(n log n) when partitions are roughly balanced; worst case is O(n^2) when partitions are maximally unbalanced (e.g. already-sorted input with a naive pivot choice). Sorts in place, O(log n) auxiliary stack space on average."}, {"term": "Binary Search", "body": "Compares the target to the middle element and recurses into the half where the target could be, discarding the other half. Recurrence T(n) = T(n/2) + O(1) solves to O(log n) by Master Theorem Case 1, requiring the array to be sorted."}, {"term": "Closest Pair Problem", "body": "Finds the two closest points among n points in a plane by recursively solving the problem on the left and right halves (split by x-coordinate) and then combining by checking only a thin strip of points near the dividing line, which can be shown to contain O(n) candidate points. Recurrence T(n) = 2T(n/2) + O(n) (with a preceding O(n log n) sort) solves to O(n log n) overall \u2014 far better than the naive O(n^2) pairwise-distance approach."}]}]}, {"num": "7", "title": "Amortized Time Complexity", "blocks": [{"title": "7.1 Methods", "items": [{"term": "Aggregate Analysis", "body": "Computes the total cost of a sequence of n operations and divides by n to get the average cost per operation, T(n)/n. This gives a single amortized cost that applies uniformly to every operation in the sequence, even though individual operations may vary wildly in actual cost."}, {"term": "Accounting Method", "body": "Assigns each operation an amortized cost that may differ from its actual cost; cheap operations are 'overcharged' and the surplus is saved as credit, which is later 'spent' to pay for expensive operations. The method is valid as long as the total credit never goes negative, guaranteeing the amortized costs bound the true total cost."}, {"term": "Potential Method", "body": "Defines a potential function Phi that maps the data structure's state to a non-negative number representing 'saved-up credit'. The amortized cost of an operation is defined as actual cost + change in potential (Phi_after \u2212 Phi_before); if Phi never drops below its initial value, the sum of amortized costs bounds the sum of actual costs, giving a rigorous mathematical framework for amortized analysis."}]}, {"title": "7.2 Applications", "items": [{"term": "Dynamic Array", "body": "When a dynamic array (e.g. Python list, C++ vector) is full and a new element is pushed, it reallocates to (typically) double its capacity and copies all existing elements \u2014 an O(n) operation. But because doubling happens exponentially less often as the array grows, the amortized cost per push averages out to O(1)."}, {"term": "Stack Operations", "body": "In algorithms where each element can be pushed and popped from a stack at most once across the entire run (e.g. the monotonic stack technique for Next Greater Element), even though a single pop can be preceded by many pushes, the total work across n operations is O(n), giving O(1) amortized cost per operation."}, {"term": "Union Find", "body": "With path compression and union by rank/size, a sequence of m union/find operations on n elements takes O(m * alpha(n)) total time, where alpha is the inverse Ackermann function \u2014 a value less than 5 for any n that could ever be written down in practice. This makes each operation's amortized cost effectively O(1) in practice, though not a strict worst-case constant for a single call."}]}]}, {"num": "8", "title": "Space\u2013Time Trade-off", "blocks": [{"title": "8.1 Optimization Techniques", "items": [{"term": "Hashing", "body": "Trades extra memory (a hash table) for near-O(1) average-case lookup, insert, and delete, turning what might otherwise require O(n) linear search into constant-time access at the cost of O(n) additional space and the risk of collisions in the worst case."}, {"term": "Memoization", "body": "Stores previously computed results of expensive function calls (typically in a hash map or array indexed by input) so repeated calls with the same input return instantly. Converts exponential-time naive recursion (e.g. Fibonacci) into linear time at the cost of O(n) extra space for the cache."}, {"term": "Lookup Table", "body": "Precomputes and stores results for all possible inputs (or a relevant range) ahead of time, so queries become O(1) array access instead of recomputation \u2014 commonly used for factorials, powers of two, or small fixed-domain functions, trading O(range) space for O(1) query time."}, {"term": "Prefix Sum", "body": "Precomputes cumulative sums of an array in O(n) so that the sum of any subrange [i, j] can be answered in O(1) via prefix[j] \u2212 prefix[i-1], instead of O(n) per query with a naive re-sum \u2014 at the cost of O(n) extra space for the prefix array."}, {"term": "Suffix Sum", "body": "The mirror of prefix sum, precomputing cumulative sums from the end of the array, useful when queries or computations naturally look at 'everything after position i' in O(1) rather than O(n) per query."}]}, {"title": "8.2 In-place Algorithms", "items": [{"term": "Constant Extra Space", "body": "An algorithm is 'in-place' when it uses O(1) additional memory beyond the input itself, modifying the input directly rather than allocating new structures proportional to n \u2014 e.g. in-place Quick Sort partitioning or reversing an array using two pointers."}, {"term": "Auxiliary Space", "body": "The extra space an algorithm uses beyond the input storage, including recursion call-stack space. It is distinct from 'total space' (input + auxiliary) \u2014 e.g. Merge Sort uses O(n) auxiliary space for merging even though the conceptual input is also O(n), while in-place Quick Sort uses only O(log n) auxiliary space for its recursion stack."}]}]}, {"num": "9", "title": "Complexity of Searching Algorithms", "blocks": [{"title": null, "items": [{"term": "Linear Search", "body": "Checks each element sequentially until the target is found or the array ends. Time: O(1) best, O(n) average and worst. Space: O(1). Works on unsorted data; no precondition required."}, {"term": "Binary Search", "body": "Repeatedly halves the search interval by comparing the target to the middle element. Time: O(1) best, O(log n) average and worst. Space: O(1) iterative, O(log n) recursive (call stack). Requires sorted data."}, {"term": "Ternary Search", "body": "Divides the search interval into three parts instead of two at each step. Time: O(log3 n), which is still O(log n) asymptotically (only the constant factor changes, and it is actually a slightly worse constant than binary search since it makes more comparisons per level). Mainly useful for finding extrema of unimodal functions."}, {"term": "Jump Search", "body": "Jumps ahead by fixed block-size steps (optimally sqrt(n)) to find the block containing the target, then does a linear scan within that block. Time: O(sqrt(n)). Requires sorted data; useful when jumping backward is costly (e.g. on certain storage media)."}, {"term": "Exponential Search", "body": "Finds a range containing the target by repeatedly doubling the index (1, 2, 4, 8, ...), then runs Binary Search within that range. Time: O(log n), and it is particularly useful for unbounded or very large sorted arrays where the size is unknown, or when the target is near the front."}, {"term": "Interpolation Search", "body": "Estimates the likely position of the target using linear interpolation based on the target's value relative to the range's endpoints (like guessing a page in a dictionary by the letter). Time: O(log log n) average case on uniformly distributed sorted data, but O(n) worst case on skewed distributions."}, {"term": "Fibonacci Search", "body": "Similar to Binary Search but divides the array using Fibonacci numbers instead of a fixed midpoint, using only addition and subtraction instead of division \u2014 historically useful on hardware where division was expensive. Time: O(log n)."}]}]}, {"num": "10", "title": "Complexity of Sorting Algorithms", "blocks": [{"title": "10.1 Comparison-based", "items": [{"term": "Bubble Sort", "body": "Repeatedly swaps adjacent out-of-order elements. Time: O(n) best (with an early-exit flag on an already-sorted array), O(n^2) average and worst. Space: O(1). Stable, adaptive."}, {"term": "Selection Sort", "body": "Repeatedly selects the minimum remaining element and swaps it into place. Time: O(n^2) in all cases (it always scans the remainder regardless of order). Space: O(1). Unstable (in typical implementations), not adaptive."}, {"term": "Insertion Sort", "body": "Builds a sorted prefix by inserting each new element into its correct position among the already-sorted elements. Time: O(n) best (nearly sorted input), O(n^2) average and worst. Space: O(1). Stable, adaptive \u2014 very fast on small or nearly-sorted arrays."}, {"term": "Merge Sort", "body": "Divide-and-conquer: split, recursively sort, merge. Time: O(n log n) in all cases. Space: O(n) auxiliary. Stable, not in-place."}, {"term": "Quick Sort", "body": "Divide-and-conquer via pivot partitioning. Time: O(n log n) best/average, O(n^2) worst (bad pivot choices, e.g. already sorted with a naive pivot). Space: O(log n) average stack, O(n) worst. Unstable, in-place, usually the fastest in practice due to cache locality and low constants."}, {"term": "Heap Sort", "body": "Builds a max-heap in O(n), then repeatedly extracts the maximum in O(log n) per extraction. Time: O(n log n) in all cases. Space: O(1) \u2014 sorts in place. Unstable, not adaptive, but guarantees O(n log n) with no worst-case blow-up."}, {"term": "Shell Sort", "body": "A generalisation of Insertion Sort that compares elements a 'gap' apart, shrinking the gap over passes. Time: depends on gap sequence, ranging from O(n log n) to O(n^1.5) to O(n^2) for different sequences. Space: O(1). Unstable, in-place."}]}, {"title": "10.2 Non-comparison", "items": [{"term": "Counting Sort", "body": "Counts occurrences of each distinct key value in a counting array, then reconstructs the sorted output from those counts. Time: O(n + k) where k is the range of key values. Space: O(n + k). Only efficient when k is not much larger than n; works on integers or integer-mappable keys."}, {"term": "Radix Sort", "body": "Sorts integers digit by digit (or byte by byte) using a stable sub-sort (typically Counting Sort) as a subroutine for each digit position. Time: O(d * (n + b)) where d is the number of digits and b is the base (e.g. 10 or 256). Space: O(n + b)."}, {"term": "Bucket Sort", "body": "Distributes elements into a fixed number of buckets based on value range, sorts each bucket individually (often with Insertion Sort), then concatenates. Time: O(n + k) average case with uniformly distributed input, O(n^2) worst case if all elements land in one bucket. Space: O(n + k)."}]}, {"title": "10.3 Stability & Adaptiveness", "items": [{"term": "Stable Sorting", "body": "A sort is stable if elements with equal keys retain their original relative order in the output. Stability matters when sorting records by one field while wanting to preserve a prior ordering on another field \u2014 Merge Sort, Insertion Sort, Bubble Sort, and Counting/Radix Sort are stable."}, {"term": "Unstable Sorting", "body": "A sort is unstable if equal-keyed elements may be reordered relative to each other. Quick Sort, Heap Sort, and Selection Sort are unstable in their standard forms (though stable variants can be constructed with extra bookkeeping)."}, {"term": "Adaptive Sorting", "body": "A sort is adaptive if it runs faster on partially-sorted input, typically achieving close to O(n) when the input is nearly sorted. Insertion Sort and Bubble Sort (with an early-exit check) are adaptive; Selection Sort, Merge Sort, and Heap Sort are not."}, {"term": "In-place Sorting", "body": "A sort is in-place if it uses O(1) (or sometimes O(log n) for recursion stack) auxiliary space beyond the input array \u2014 Quick Sort, Heap Sort, Insertion Sort, Selection Sort, and Bubble Sort are in-place; standard Merge Sort is not."}]}]}, {"num": "11", "title": "Complexity of Data Structures", "blocks": [{"title": "11.1 Arrays", "items": [{"term": "Access", "body": "O(1) \u2014 direct index computation via base address + index * element size."}, {"term": "Search", "body": "O(n) unsorted (linear scan), O(log n) if sorted (binary search)."}, {"term": "Insert", "body": "O(n) worst case \u2014 inserting at the front or middle requires shifting subsequent elements; O(1) amortized at the end for a dynamic array."}, {"term": "Delete", "body": "O(n) worst case \u2014 deleting from the front or middle requires shifting subsequent elements down; O(1) at the end."}]}, {"title": "11.2 Strings", "items": [{"term": "Traversal", "body": "O(n) to visit every character once, where n is the string length."}, {"term": "Pattern Matching", "body": "O(n*m) naive (n = text length, m = pattern length); O(n + m) with KMP, Z-algorithm, or Rabin-Karp (average case for the latter)."}]}, {"title": "11.3 Linked List", "items": [{"term": "Singly Linked List", "body": "Access/Search O(n); Insert/Delete O(1) at a known node (given a pointer), O(n) to find that node first."}, {"term": "Doubly Linked List", "body": "Same asymptotic costs as singly linked, but supports O(1) deletion given only a node reference (no need to track the previous node) and O(1) backward traversal."}, {"term": "Circular Linked List", "body": "Same core operation costs as singly/doubly linked lists; the last node points back to the first, making O(1) access to the 'front' from the 'end' possible without a separate tail pointer walk."}]}, {"title": "11.4 Stack", "items": [{"term": "Push", "body": "O(1) \u2014 add to the top."}, {"term": "Pop", "body": "O(1) \u2014 remove from the top."}, {"term": "Peek", "body": "O(1) \u2014 read the top element without removing it."}]}, {"title": "11.5 Queue", "items": [{"term": "Enqueue", "body": "O(1) \u2014 add to the rear (amortized O(1) for a dynamic-array-backed queue)."}, {"term": "Dequeue", "body": "O(1) \u2014 remove from the front."}, {"term": "Circular Queue", "body": "O(1) enqueue/dequeue using modular index arithmetic to reuse freed slots without shifting elements."}, {"term": "Priority Queue", "body": "O(log n) insert and extract-min/max when backed by a binary heap; O(1) peek at the top priority element."}]}, {"title": "11.6 Hash Table", "items": [{"term": "Insert", "body": "O(1) average case; O(n) worst case if all keys collide into one bucket."}, {"term": "Search", "body": "O(1) average case; O(n) worst case under heavy collisions."}, {"term": "Delete", "body": "O(1) average case; O(n) worst case under heavy collisions."}, {"term": "Collision Cases", "body": "Handled via chaining (each bucket holds a linked list/array of colliding entries, degrading to O(n) per bucket in the worst case) or open addressing (probing for the next free slot, e.g. linear/quadratic probing or double hashing), both of which affect worst-case bounds under adversarial input or a poor hash function."}]}, {"title": "11.7 Trees", "items": [{"term": "BST (Binary Search Tree)", "body": "O(h) for search/insert/delete where h is tree height \u2014 O(log n) average on random data, O(n) worst case if the tree degenerates into a linked list (e.g. inserting sorted data)."}, {"term": "AVL Tree", "body": "A self-balancing BST that maintains height difference <= 1 between subtrees via rotations. Guarantees O(log n) for search/insert/delete in all cases."}, {"term": "Red-Black Tree", "body": "A self-balancing BST using colour-based balancing rules, guaranteeing O(log n) for search/insert/delete in all cases, with fewer rotations than AVL on average (favoured for insert-heavy workloads)."}, {"term": "Segment Tree", "body": "O(log n) for range query and point/range update; O(n) build time; O(n) space."}, {"term": "Fenwick Tree (BIT)", "body": "O(log n) for prefix-sum query and point update; O(n) build time; O(n) space \u2014 simpler and more memory-efficient than a segment tree for prefix-sum-style queries."}]}, {"title": "11.8 Heap", "items": [{"term": "Min Heap", "body": "O(1) find-min, O(log n) insert and extract-min, O(n) build (via heapify from an unsorted array)."}, {"term": "Max Heap", "body": "Same costs as Min Heap, mirrored: O(1) find-max, O(log n) insert and extract-max."}]}, {"title": "11.9 Trie", "items": [{"term": "Insert", "body": "O(L) where L is the length of the key being inserted, independent of how many other keys are stored."}, {"term": "Search", "body": "O(L) to check whether a key exists."}, {"term": "Prefix Query", "body": "O(P) to check whether any stored key has a given prefix, where P is the prefix length \u2014 this is the key advantage of a trie over a hash table for prefix-based lookups."}]}, {"title": "11.10 Graph", "items": [{"term": "BFS (Breadth-First Search)", "body": "O(V + E) using an adjacency list, where V is vertices and E is edges; visits every vertex and edge once."}, {"term": "DFS (Depth-First Search)", "body": "O(V + E) using an adjacency list, same reasoning as BFS."}, {"term": "Dijkstra's Algorithm", "body": "O((V + E) log V) with a binary heap priority queue; O(V^2) with a naive array-based minimum extraction \u2014 used for single-source shortest paths with non-negative weights."}, {"term": "Floyd\u2013Warshall", "body": "O(V^3) \u2014 computes all-pairs shortest paths via dynamic programming over intermediate vertices; simple to implement but only practical for smaller graphs due to the cubic term."}, {"term": "Union-Find (Disjoint Set)", "body": "O(alpha(n)) amortized per operation with path compression and union by rank \u2014 effectively constant time in practice, used heavily in Kruskal's MST algorithm and connectivity queries."}]}]}, {"num": "12", "title": "DSA Problem Solving Patterns & Their Complexity", "blocks": [{"title": "12.1 Two Pointers", "items": [{"term": "Opposite Ends", "body": "Two indices start at the beginning and end of a sorted array/structure and move toward each other based on a condition (e.g. two-sum on sorted array, container-with-most-water). Time: O(n) \u2014 each pointer moves at most n times total; Space: O(1)."}, {"term": "Same Direction", "body": "Both pointers move forward, with one typically 'ahead' of the other (e.g. removing duplicates in place, fast/slow pointer for cycle detection). Time: O(n); Space: O(1)."}]}, {"title": "12.2 Sliding Window", "items": [{"term": "Fixed Window", "body": "Maintains a window of constant size k that slides across the array, updating an aggregate (sum, max, etc.) incrementally rather than recomputing from scratch. Time: O(n) instead of the naive O(n*k); Space: O(1) to O(k) depending on what's tracked."}, {"term": "Variable Window", "body": "The window's size grows and shrinks based on a condition (e.g. smallest subarray with sum >= target, longest substring without repeating characters). Time: O(n) amortized, since each pointer advances at most n times total across the whole run; Space: O(1) to O(k)."}]}, {"title": "12.3 Prefix Techniques", "items": [{"term": "Prefix Sum", "body": "O(n) preprocessing, O(1) range-sum query \u2014 see also Section 8.1."}, {"term": "Prefix XOR", "body": "Same idea as prefix sum but with XOR: O(n) preprocessing, O(1) range-XOR query, useful for subarray XOR problems since XOR is its own inverse."}, {"term": "Difference Array", "body": "O(1) per range-update during accumulation, O(n) to materialise final values via one prefix-sum pass \u2014 turns O(n) per range-update into O(1) amortized when many updates precede a single read pass."}]}, {"title": "12.4 Monotonic Structures", "items": [{"term": "Monotonic Stack", "body": "A stack kept in increasing or decreasing order by popping elements that violate the order before pushing a new one; used for Next/Previous Greater/Smaller Element problems. Time: O(n) total \u2014 each element is pushed and popped at most once (amortized analysis, see Section 7.2)."}, {"term": "Monotonic Queue", "body": "A deque kept in monotonic order, used to maintain the maximum or minimum within a sliding window (e.g. Sliding Window Maximum). Time: O(n) total, since each element is pushed and popped at most once across the run."}]}, {"title": "12.5 Binary Search (as a pattern)", "items": [{"term": "Binary Search on Answer", "body": "Applies binary search not on array indices but on the space of possible answers, using a monotonic 'is this answer feasible?' check to narrow down the minimum/maximum valid answer. Time: O(log(range) * cost of feasibility check)."}, {"term": "Lower Bound", "body": "Finds the first position where a value could be inserted to keep the array sorted while placing it before any equal elements \u2014 O(log n)."}, {"term": "Upper Bound", "body": "Finds the first position where a value could be inserted while placing it after any equal elements \u2014 O(log n)."}]}, {"title": "12.6 Dynamic Programming (as a pattern)", "items": [{"term": "Memoization (Top-Down)", "body": "Recursion plus caching of subproblem results, computed lazily (only when needed). Time is O(number of distinct subproblems * work per subproblem); adds recursion call-stack overhead, O(depth) space, on top of the cache."}, {"term": "Tabulation (Bottom-Up)", "body": "Iteratively fills a DP table from base cases upward, avoiding recursion overhead entirely. Same overall time complexity as memoization but typically better constant factors and no stack-overflow risk for deep recursion."}, {"term": "Space Optimization", "body": "Many DP recurrences only reference the previous one or two rows/states, allowing the full O(n) or O(n*m) table to be collapsed into O(1) or O(m) rolling variables \u2014 reduces space without changing time complexity."}]}, {"title": "12.7 Greedy", "items": [{"term": "Interval Scheduling", "body": "Sort intervals by end time and greedily pick the next non-overlapping interval \u2014 O(n log n) dominated by the sort, provably optimal for maximising the count of non-overlapping intervals."}, {"term": "Huffman Coding", "body": "Repeatedly merges the two lowest-frequency nodes using a min-heap to build an optimal prefix-free binary encoding tree. Time: O(n log n) for n distinct symbols."}, {"term": "Activity Selection", "body": "A specific case of interval scheduling maximising the number of non-conflicting activities; O(n log n) via sorting by finish time, then a single O(n) greedy pass."}]}, {"title": "12.8 Backtracking", "items": [{"term": "Permutations", "body": "Generates all n! orderings by recursively fixing one element at a time and swapping/recursing on the rest, undoing the choice on return. Time: O(n * n!) \u2014 n! permutations, each taking O(n) to construct/copy."}, {"term": "Combinations", "body": "Generates all C(n, k) subsets of size k by recursively including/excluding elements with pruning once fewer than k elements remain achievable. Time: O(k * C(n, k))."}, {"term": "N Queens", "body": "Places queens row by row, backtracking whenever a placement conflicts with an existing queen, pruning invalid branches early. Worst-case time is O(n!) in the naive bound, though conflict pruning makes the practical runtime far smaller."}, {"term": "Sudoku", "body": "Fills empty cells one at a time, backtracking on constraint violations (row/column/box uniqueness). Worst-case time is exponential, O(9^(number of empty cells)) in the crude bound, though constraint propagation prunes this drastically in practice."}]}]}, {"num": "13", "title": "Complexity Optimization", "blocks": [{"title": "13.1 From Brute Force to Optimal", "items": [{"term": "Remove Redundant Computation", "body": "Identify work that is repeated unnecessarily across iterations or recursive calls (e.g. recomputing a subarray sum inside a loop) and compute it once, reusing the result \u2014 often the single biggest optimisation lever, turning O(n^2) into O(n)."}, {"term": "Precomputation", "body": "Do expensive work once upfront (sorting, building a prefix-sum array, building a frequency map) so that each subsequent query becomes cheap \u2014 trades a one-time preprocessing cost for much faster repeated queries."}, {"term": "Hashing", "body": "Replace O(n) linear lookups with O(1) average-case hash-based lookups, commonly converting an O(n^2) nested-loop search (e.g. two-sum) into O(n)."}, {"term": "Sorting First", "body": "Sorting the input in O(n log n) upfront often unlocks O(n) or O(log n) techniques afterward (two pointers, binary search) that would otherwise require O(n^2) or O(n) per query on unsorted data \u2014 the net gain outweighs the sort's cost when many queries follow."}, {"term": "Bit Manipulation", "body": "Uses bitwise operations to compress state or perform set operations in O(1) per word instead of O(k) for a k-element structure, commonly used in bitmask DP and subset enumeration to shrink both time and space constants."}]}, {"title": "13.2 Complexity Reduction (illustrative jumps)", "items": [{"term": "O(n^3) -> O(n^2)", "body": "Typically achieved by eliminating one nested loop through precomputation \u2014 e.g. replacing an inner O(n) sum computation with an O(1) prefix-sum lookup inside a double loop."}, {"term": "O(n^2) -> O(n log n)", "body": "Typically achieved by sorting the input and applying a two-pointer or binary-search technique instead of nested brute-force comparison, or by switching to a divide-and-conquer formulation."}, {"term": "O(n log n) -> O(n)", "body": "Typically achieved by replacing a comparison/sort-based step with a hashing or counting-based technique (when the value range permits) that avoids the log n factor entirely, e.g. Counting Sort instead of comparison sorting when the key range is small."}]}]}, {"num": "14", "title": "Time Complexity in Interviews", "blocks": [{"title": "14.1 Estimation Rules", "items": [{"term": "10^8 Operations Rule", "body": "A typical judge/interview execution environment can perform roughly 10^8 (sometimes up to ~10^9 for very simple operations) primitive operations per second. This gives a quick sanity check: for n = 10^5, an O(n^2) solution (~10^10 operations) will likely time out, while O(n log n) (~1.7*10^6) will run comfortably."}, {"term": "10^6 Operations Rule", "body": "For a time limit of about one second and n around 10^3, an O(n^2) algorithm (~10^6 operations) is safely within budget \u2014 this scale is the rough boundary where quadratic solutions remain acceptable."}, {"term": "10^9 Operations Rule", "body": "Anything approaching or exceeding ~10^9 operations is risky even for O(1)-per-op work, since most environments cannot guarantee 10^9 ops/sec reliably within a 1-second limit \u2014 this is the rough ceiling above which an algorithm needs a fundamentally better complexity class, not just micro-optimisation."}]}, {"title": "14.2 Identifying Complexity Quickly", "items": [{"term": "Loop-based Questions", "body": "Count nested loop depth and how each loop's bound relates to n: a single loop is O(n), two independent nested loops are O(n^2), a loop that halves each time is O(log n) \u2014 read the loop structure directly to estimate complexity before writing code."}, {"term": "Recursive Questions", "body": "Write down the recurrence relation from the function's structure (how many recursive calls, on what fraction of input, plus non-recursive work) and solve it via the Master Theorem, recursion tree, or substitution, exactly as in Section 5."}, {"term": "Mixed Iterative + Recursive", "body": "Multiply the complexity of the iterative work done at each recursive call by the number of calls implied by the recursion \u2014 e.g. a recursive function making 2 calls on n/2 with an O(n) loop at each level is 2T(n/2) + O(n) = O(n log n), not simply the loop's complexity alone."}, {"term": "Multi-variable Complexity", "body": "When an algorithm depends on two independent input sizes (e.g. two strings of length m and n, or two arrays), express complexity with both variables rather than collapsing them \u2014 O(m + n) for work proportional to each independently (e.g. merging two lists), O(m * n) for work that pairs every element of one with every element of the other (e.g. naive substring search, edit distance DP table)."}]}]}]};

const nav = document.getElementById('nav');
const main = document.getElementById('main');
const search = document.getElementById('search');
const noResults = document.getElementById('no-results');
const resultCount = document.getElementById('result-count');

function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Build nav
DATA.sections.forEach(s=>{
  const a = document.createElement('a');
  a.href = '#sec-' + s.num;
  a.innerHTML = `<span class="n">${s.num}.</span>${escHtml(s.title)}`;
  nav.appendChild(a);
});

// Build main content
DATA.sections.forEach(s=>{
  const sec = document.createElement('section');
  sec.className = 'chapter';
  sec.id = 'sec-' + s.num;
  let html = `<h2 class="section-title">${s.num}. ${escHtml(s.title)}</h2>`;
  s.blocks.forEach(b=>{
    if(b.title) html += `<h3 class="block-title">${escHtml(b.title)}</h3>`;
    b.items.forEach(item=>{
      html += `<div class="item" data-term="${escHtml(item.term).toLowerCase()}" data-body="${escHtml(item.body).toLowerCase()}">
        <span class="term">${escHtml(item.term)}</span>
        <span class="body">${escHtml(item.body)}</span>
      </div>`;
    });
  });
  sec.innerHTML = html;
  main.appendChild(sec);
});

const allItems = Array.from(document.querySelectorAll('.item'));
const allChapters = Array.from(document.querySelectorAll('section.chapter'));
const allBlockTitles = Array.from(document.querySelectorAll('h3.block-title'));

function highlight(el, query){
  const termEl = el.querySelector('.term');
  const bodyEl = el.querySelector('.body');
  const orig = { term: termEl.textContent, body: bodyEl.textContent };
  if(!query){ termEl.innerHTML = orig.term; bodyEl.innerHTML = orig.body; return; }
  const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
  termEl.innerHTML = orig.term.replace(re, '<mark>$1</mark>');
  bodyEl.innerHTML = orig.body.replace(re, '<mark>$1</mark>');
}

function runSearch(){
  const q = search.value.trim().toLowerCase();
  let visibleCount = 0;
  allItems.forEach(item=>{
    const match = !q || item.dataset.term.includes(q) || item.dataset.body.includes(q);
    item.classList.toggle('hidden', !match);
    if(match){ visibleCount++; }
    highlight(item, q);
  });
  allChapters.forEach(ch=>{
    const anyVisible = ch.querySelectorAll('.item:not(.hidden)').length > 0;
    ch.classList.toggle('hidden', !anyVisible);
  });
  noResults.classList.toggle('show', q && visibleCount === 0);
  resultCount.textContent = q ? `${visibleCount} concept${visibleCount===1?'':'s'} found` : '';
}

search.addEventListener('input', runSearch);
document.getElementById('nav').addEventListener('click', ()=>{ search.value=''; runSearch(); });

// Reveal animations + active navigation
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add('visible');
      const id=e.target.id;
      document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+id));
    }
  });
},{threshold:0.12});
document.querySelectorAll('.chapter').forEach(s=>observer.observe(s));

// Typewriter subtitle
const subtitle=document.querySelector('header p');
const full=subtitle.textContent;
subtitle.textContent='';
let idx=0;
(function type(){
  if(idx<=full.length){
    subtitle.textContent=full.slice(0,idx++);
    requestAnimationFrame(()=>setTimeout(type,22));
  }
})();

</script>
